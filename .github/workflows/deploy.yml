# Auto build + deploy: push to main → prod Worker (jrny-spark), push to dev
# (or manual run from any branch) → dev Worker (jrny-spark-dev); typecheck-only
# on PRs. Secrets/vars (repo Settings → Secrets and variables → Actions):
#   secrets.CONVEX_DEPLOY_KEY            Convex dashboard → PROD deployment → Settings → Deploy key (prod:…)
#   secrets.CONVEX_DEPLOY_KEY_DEV        Convex dashboard → DEV deployment → Settings → Deploy key (dev:…)
#   secrets.CLOUDFLARE_API_TOKEN         dash.cloudflare.com → profile → API Tokens → "Edit Cloudflare Workers" template
#   secrets.CLOUDFLARE_ACCOUNT_ID        Cloudflare dashboard → Workers overview → right sidebar
#   vars.VITE_CLERK_PUBLISHABLE_KEY      Clerk prod instance (pk_live_…) — public, baked into the JS bundle
#   vars.VITE_CLERK_PUBLISHABLE_KEY_DEV  Clerk dev instance (pk_test_…)
#   vars.VITE_POSTHOG_KEY                (optional) PostHog project key — unset = analytics code never runs
# CLERK_SECRET_KEY is deliberately absent: it's a per-Worker runtime secret —
# `wrangler secret put CLERK_SECRET_KEY` (prod) / `… --env dev` (dev). See README.
name: Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  # Manual dev deploy of ANY branch (Actions tab → Deploy → Run workflow).
  workflow_dispatch:

# One deploy at a time; never cancel a deploy mid-flight (a killed run could
# leave Convex updated but the Worker stale). PR checks do cancel-and-replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  deploy:
    name: Deploy (Convex + Cloudflare)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Pushes Convex functions to prod and runs `bun run build` with the
      # prod VITE_CONVEX_URL injected — do NOT set VITE_CONVEX_URL here,
      # it would shadow the injected value.
      - name: Deploy Convex + build frontend
        run: bunx convex deploy --cmd 'bun run build'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      # Idempotent upsert (convex/seed.ts) — keeps prod starter decks in
      # sync with convex/starterDecks.ts on every deploy.
      - name: Seed starter decks
        run: bunx convex run seed:seedDecks
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-dev:
    name: Deploy dev (Convex dev + jrny-spark-dev)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    environment: development
    env:
      # Selects wrangler.jsonc's env.dev at BUILD time (vite bakes it into
      # dist); the wrangler deploy step then ships jrny-spark-dev. The var
      # is a no-op for wrangler deploy itself.
      CLOUDFLARE_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # dev:… key → pushes functions to the existing DEV Convex deployment
      # (the one `bun run dev:convex` uses) and injects its VITE_CONVEX_URL.
      - name: Deploy Convex (dev) + build frontend
        run: bunx convex deploy --cmd 'bun run build'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_DEV }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY_DEV }}

      - name: Seed starter decks (dev)
        run: bunx convex run seed:seedDecks
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}

      - name: Deploy dev Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
